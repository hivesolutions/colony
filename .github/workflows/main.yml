name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python-version: 2.7
          - python-version: 3.5
          - python-version: 3.6
          - python-version: 3.7
          - python-version: 3.8
          - python-version: 3.9
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: latest
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r extra.txt

      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: |
          pip install black
          black . --check

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Run legacy tests
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "latest"]'), matrix.python-version) }}
        run: python setup.py test

  build-pypy:
    name: Build PyPy
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python-version: 2.7
          - python-version: 3.6
          - python-version: 3.9
          - python-version: "3.10"
          - python-version: latest
    runs-on: ubuntu-latest
    container: pypy:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show PyPy version
        run: pypy --version

      - name: Install dependencies
        if: matrix.python-version != 'latest'
        run: pip install -r requirements.txt

      - name: Install dependencies without compiling
        if: matrix.python-version == 'latest'
        run: pip install --no-compile -r requirements.txt

      - name: Install extra dependencies
        run: pip install -r extra.txt

      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: |
          pip install black
          black . --check

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Run legacy tests
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "latest"]'), matrix.python-version) }}
        run: pypy setup.py test
