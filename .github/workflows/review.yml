name: Review Workflow
on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
  CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'max' }}

jobs:
  review:
    name: Review with Claude
    timeout-minutes: 30
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ubuntu, latest]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Cleanup the hosted runner
        uses: joamag/cleanup-hosted@master

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Its branch is already checked out in the
            working directory, and AGENTS.md holds the conventions of the
            repository, which the review follows.

            Colony is the base of the Colony Framework, published to PyPI as
            the `colony` package: its plugin manager loads the plugins of
            colony-plugins and of the solutions built on them (eg: Omni), and
            its libraries are imported by all of them, so a change reaches code
            outside this repository.

            Look for, in this order:

            1. Bugs and regressions: wrong behaviour, unhandled errors and edge
               cases, plugins loaded, unloaded or resolved in the wrong order
               (their dependencies, capabilities and events, and the
               configuration of the plugin manager), threads and resources left
               behind when the manager stops, values the libraries convert,
               round or format differently on Python 2.7 and on Python 3 (the
               rounding of `round_util` included), and anything a test should
               have caught.
            2. The public interface: colony is a published package, so the
               names exported by `colony`, the signatures of the plugin manager,
               of `colony.Plugin` and `colony.System` and of the functions of
               the libraries, and the configuration they read are used by
               callers outside this repository. A signature that gains an
               argument before the existing ones, a renamed or reordered
               parameter, a changed default and a removed name all break them,
               and as the plugins extend `colony.Plugin` and `colony.System`, a
               protected method is part of that surface as well.
            3. The rules of AGENTS.md the change may break: code that runs on
               Python 2.7 and on Python 3.13 alike (without relying on the order
               of the keys of a dict, which Python 2.7 and 3.5 do not keep), no
               type annotations in the `.py` files (they belong in the `.pyi`
               stub beside the module, which follows any change of its
               signatures), the black formatting, the CRLF line endings of the
               files kept as they are, `not item in list` and `item == None`,
               the commenting style of the project, and the version left alone
               outside of a release (`setup.py`, `colony.json` and
               `colony.log.json` being changed by the `version:` commits alone).
            4. Tests: the new and changed code covered by tests written like the
               existing ones, placed in `src/colony/test` mirroring the module
               they cover, extending `colony.ColonyTestCase`, passing under both
               pytest and the legacy `python setup.py test` (which runs them on
               the older Python versions), and exercising the error paths rather
               than the happy one alone.
            5. The documents the change should update: the unreleased section of
               the changelog, and the README (the Configuration table for a new
               configuration value, and the usage of what changed).
            6. Security: the password hashes and the cryptography of the
               libraries (`crypt_util` and `aes_util`: salts, iterations and
               comparisons in constant time), the paths built from input, the
               plugins and code loaded from the paths of the manager, the
               commands of `colony_adm`, secrets reaching the logs (Logstash
               included), and data reaching someone it should not.

            Verify every finding against the code before reporting it, reading the
            files around the diff and not the diff alone, and say how sure you
            are. Leave out what black settles, praise and restatements of what
            the change does: a short review of real findings is worth more than a
            long one.

            Report each finding as an inline comment on the line it is about,
            saying what is wrong, why it matters and how to fix it, and use a
            top-level comment for the summary: the findings by severity, or that
            none was found.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --effort ${{ env.CLAUDE_EFFORT }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
